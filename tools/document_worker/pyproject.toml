[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinel-document-worker"
version = "0.1.0"
description = "DOC01 Part A: bounded local document extraction worker (separately locked; not an app dependency)"
requires-python = ">=3.11.5,<3.13"
dependencies = [
    # Microsoft MarkItDown, MIT. Retain the verified 0.1.8 adapter during the security refresh.
    # Only the supported PDF and XLSX extras are installed.

    "markitdown[pdf,xlsx]==0.1.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3,<10",
    "ruff>=0.9,<1",
]

[project.scripts]
sentinel-docworker = "docworker.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }
packages = ["docworker"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.uv]
# Supply-chain hygiene for this worker only: every package must have been released at least
# two weeks before the original lock. The named exceptions admit security fixes.

exclude-newer = "2026-10-29T00:00:00Z"
exclude-newer-package = { certifi = "2026-11-16T00:00:00Z", soupsieve = "2026-11-16T00:00:00Z", pytest = "2026-11-16T00:00:00Z" }
