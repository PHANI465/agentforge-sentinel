[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentforge-sentinel"
version = "0.1.0"
description = "Fraud investigation workbench: contracts and thin integrated API path"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "psycopg[binary]>=3.2,<4",
    "pydantic>=2.7,<3",
    "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27,<1",
    "pytest>=9.0.3,<10",
    "ruff>=0.9,<1",
]
ml = [
    "numpy>=1.26,<3",
    "scikit-learn>=1.5,<2",
]

[tool.setuptools]
# sentinel lives under src/; the C03/C04 packages the model scorer needs stay at the root.
package-dir = { "" = "src", "ml" = "ml", "data_pipeline" = "data_pipeline" }
packages = ["sentinel", "sentinel.agents", "sentinel.contracts", "sentinel.db", "ml", "data_pipeline"]

[tool.setuptools.package-data]
"sentinel.db" = ["migrations/*.sql"]
# Only the accepted p1 identity files; tests, evals and training snapshots are not shipped.
"ml" = ["protocol.json", "runs/p1/*.json", "artifacts/p1/*", "results/p1/*"]
"data_pipeline" = ["manifests/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]  # "." for the top-level data_pipeline package
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
# The standalone helper tests intentionally bootstrap the scripts import path.
"tests_handoff/test_handoff.py" = ["E402"]

[tool.uv]
# Supply-chain hygiene, scoped: only these packages are held to releases at least two weeks
# old (their newest releases were days old when added; numpy/narwhals with the C04 ml extra).
# Not a project-wide rule.
exclude-newer-package = { certifi = "2026-11-16T00:00:00Z", fastapi = "2026-10-09T00:00:00Z", starlette = "2026-10-09T00:00:00Z", numpy = "2026-10-10T00:00:00Z", narwhals = "2026-10-10T00:00:00Z" }
