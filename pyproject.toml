[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentforge-sentinel"
version = "0.1.0"
description = "Fraud investigation workbench: contracts and thin integrated API path"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "psycopg[binary]>=3.2,<4",
    "pydantic>=2.7,<3",
    "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27,<1",
    "pytest>=8.3,<9",
    "ruff>=0.9,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"sentinel.db" = ["migrations/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
# The standalone helper tests intentionally bootstrap the scripts import path.
"tests_handoff/test_handoff.py" = ["E402"]

[tool.uv]
# Supply-chain hygiene: newly added transitive packages must be at least two weeks old.
exclude-newer-package = { certifi = "2026-10-09T00:00:00Z", fastapi = "2026-10-09T00:00:00Z", starlette = "2026-10-09T00:00:00Z" }
