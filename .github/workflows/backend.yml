# Backend checks in a clean Linux environment (C06). Frontend/browser checks are Cursor's
# separate workflow. No secrets are used; live model calls are disabled and asserted skipped.
name: backend

on:
  push:
    branches: [main, "task/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      SENTINEL_LIVE_CLAUDE: "0"
      SENTINEL_INVESTIGATOR: deterministic
      UV_PYTHON: "3.11"
    defaults:
      run:
        shell: bash
    steps:
      # Actions are pinned to full commit SHAs (resolved from the named tags on 2026-10-23).
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e  # v6.8.0
        with:
          version: "0.9.26"
          enable-cache: true

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: "22"

      - name: PostgreSQL binaries for disposable test clusters
        run: |
          if ! ls -d /usr/lib/postgresql/*/bin >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends postgresql
          fi
          bin=$(ls -d /usr/lib/postgresql/*/bin | sort -V | tail -1)
          "$bin/postgres" --version
          echo "SENTINEL_PG_BIN=$bin" >> "$GITHUB_ENV"

      - name: Install locked dependencies
        run: uv sync --locked --extra dev

      - name: Lint
        run: uv run --locked python -m ruff check .

      - name: Tests (disposable Postgres, deterministic investigator)
        run: |
          uv run --locked python -m pytest -q -rs | tee pytest.log
          # The only allowed skip is the opt-in live Claude test, and it must be skipped.
          grep -q "live Claude smoke test uses subscription quota" pytest.log

      - name: Handoff helper regressions (isolated Git config and identity)
        run: uv run --locked python -m unittest discover -s tests_handoff -v

      - name: JSON Schema exports are current
        run: uv run --locked python scripts/export_contracts.py --check

      - name: Node transport check
        run: node scripts/check_contract_examples.mjs

      - name: Package contents (wheel and sdist ship migrations)
        run: uv run --locked python scripts/check_package.py
